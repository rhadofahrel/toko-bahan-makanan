[phases.setup]
nixPkgs = ["nodejs_22", "php", "phpPackages.composer"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm ci"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "sleep 10 && php artisan migrate --force || true && php artisan serve --host=0.0.0.0 --port=$PORT"